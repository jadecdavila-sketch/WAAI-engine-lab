<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counterpoint Foundations</title>
<meta name="description" content="Counterpoint Foundations, the entry course for the WAAI AI Engine Lab.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/course.css">
<style>
  /* the title slide: the mark and the name, side by side, and nothing else */
  body.slide{min-height:100vh;display:flex;flex-direction:column}
  .talk{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 0 96px}
  .talk .wrap{max-width:none;width:100%;padding:0 clamp(24px,4vw,64px);display:flex;align-items:center;gap:clamp(28px,4vw,64px)}
  .mark{flex:none;width:min(clamp(360px,38vw,560px),62vh);aspect-ratio:1}
  .mark svg{width:100%;height:100%;display:block;overflow:visible}
  .title{min-width:0;transform:translateY(7%)} /* the name hangs a touch below the mark's centre line, on purpose */
  .talk .kicker{margin:0 0 14px;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  .talk h1{font-size:clamp(44px,8vw,128px);font-weight:900;font-stretch:88%;line-height:.92;letter-spacing:-.035em;margin:0;color:var(--ink)}
  .talk h1 span{display:block}
  /* the counterweight: three small words, slow and spaced, the last thing the eye lands on */
  .motto{display:flex;align-items:center;gap:16px;margin:clamp(20px,2.4vw,34px) 0 0;font-size:13px;font-weight:700;letter-spacing:.34em;color:var(--ink)}
  .motto::before,.motto::after{content:"";width:40px;height:3px;background:var(--orange);flex:none}
  /* talk navigation: arrow keys and a corner link */
  .tnav{position:fixed;right:22px;bottom:18px;display:flex;gap:10px;z-index:9}
  .tnav a{background:var(--ink);color:#fff;text-decoration:none;font-size:13px;font-weight:800;padding:9px 14px;border:2px solid var(--ink)}
  .tnav a:hover{background:#fff;color:var(--ink)}
  .tnav a.prev{background:var(--cream);color:var(--ink)}
  .tnav a.prev:hover{background:var(--ink);color:#fff}
  @media(max-width:560px){ .tnav{position:static;justify-content:flex-end;padding:0 24px 12px} }
  @media(max-width:760px){
    .talk{padding:32px 0 48px}
    .talk .wrap{flex-direction:column;align-items:flex-start;gap:28px}
    .mark{width:min(72vw,320px);align-self:center}
    .title{transform:none}
    .talk h1{font-size:clamp(44px,13vw,80px)}
  }
</style>
</head>
<body class="slide">

<main class="talk"><div class="wrap">
  <div class="mark" id="mark"></div>
  <div class="title">
    <p class="kicker">Women Applying AI, AI Engine Lab</p>
    <h1><span>Counterpoint</span><span>Foundations</span></h1>
    <p class="motto" lang="es">LA PRISA MATA</p>
  </div>
</div></main>
<nav class="tnav" aria-label="Talk"><a class="next" href="why-a-framework.html">Next: why a framework? &rarr;</a></nav>

<script src="assets/mark.js"></script>
<script>
  CPMark.mount(document.getElementById('mark'));
  /* right arrow or space goes forward, left arrow goes back */
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea')) return;
    const nxt = document.querySelector('.tnav a.next'), prv = document.querySelector('.tnav a.prev');
    if ((e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') && nxt) { e.preventDefault(); location.href = nxt.href; }
    if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && prv) { e.preventDefault(); location.href = prv.href; }
  });
</script>
</body>
</html>
